# =============================================================================
# NeuroNest AI - Render Blueprint
#
# One repository, two services:
#   neuronest-api  -> FastAPI (uvicorn) web service
#   neuronest-web  -> React/Vite static site (the PWA)
#
# How to use it
#   Option A (recommended): push this repo to GitHub, then on Render choose
#     New -> Blueprint -> pick the repo. Render finds this file and creates both
#     services in one go.
#   Option B: deploy each service manually in the dashboard - the values below
#     are exactly what to type in. Full walkthrough: docs/RENDER_DEPLOYMENT.md
#
# Secrets are NOT stored here. SUPABASE_DB_PASSWORD must be typed in during the
# import (or added afterwards under Environment). JWT_SECRET_KEY is generated by
# Render at create time because of `generateValue`.
#
# `sync: false` on a variable means "Render may keep its own value; do not wipe
# it when this file changes" - that is what keeps the database password alive
# across redeploys.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend - FastAPI
  # ---------------------------------------------------------------------------
  - type: web
    name: neuronest-api
    runtime: python
    # Singapore sits closest to the Supabase project (AWS ap-south-1, Mumbai),
    # which is worth ~60-90 ms on every query. If your account does not offer
    # `singapore`, change it to `oregon` or `virginia` - nothing else breaks.
    region: singapore
    plan: free
    rootDir: backend
    # Render's Python runtime reads .python-version in rootDir. The interpreter
    # is now pinned through the PYTHON_VERSION env var below, which keeps the
    # deployed interpreter identical to the local venv (3.11).
    buildCommand: pip install -r requirements.txt
    # Render injects PORT. The fallback keeps the command usable elsewhere
    # (e.g. `bash -c` inside a Render shell) without a confusing uvicorn error.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ---- Runtime pin ----
      # Render picks the interpreter from PYTHON_VERSION; the old
      # `runtimeVersion` key is no longer part of the Blueprint spec. 3.11.9 is
      # the exact build the local venv runs on.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ---- Database: Supabase Postgres (the live datastore) ----
      - key: USE_SUPABASE
        value: "true"
      - key: SUPABASE_URL
        value: https://pvcycmcotmkzmkreolfz.supabase.co
      - key: SUPABASE_PROJECT_REF
        value: pvcycmcotmkzmkreolfz
      # SESSION pooler (port 5432). Render egress is IPv4 and the pooler
      # resolves IPv4, which is the combination this app needs - the direct
      # host db.<ref>.supabase.co is IPv6-only and times out from a client.
      - key: SUPABASE_DB_HOST
        value: aws-0-ap-south-1.pooler.supabase.com
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_USER
        value: postgres.pvcycmcotmkzmkreolfz
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_SSL_MODE
        value: require
      # Type the real value in at import time. Leaving the placeholder is safe:
      # app/config.py treats it as "not configured" and falls back to SQLite
      # with a warning in the service log instead of failing obscurely.
      - key: SUPABASE_DB_PASSWORD
        sync: false
      # Optional - only used by the /health/supabase probe and by Storage /
      # Realtime. Not needed for reading/writing data.
      - key: SUPABASE_ANON_KEY
        sync: false
      # ---- Auth ----
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # ---- CORS ----
      # Must contain the exact origin of the static site below. Change this if
      # you rename neuronest-web or claim a custom domain. Local dev origins are
      # kept so `npm run dev` against the deployed API still works.
      - key: CORS_ORIGINS
        value: https://neuronest-web.onrender.com,http://localhost:5173
      # ---- Pool sizing (free instance = 512 MB, keep it small) ----
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "120"

  # ---------------------------------------------------------------------------
  # Frontend - React + Vite static site (PWA)
  # ---------------------------------------------------------------------------
  - type: web
    name: neuronest-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Build-time value baked into the bundle (Vite inlines import.meta.env.*).
      # Must match the neuronest-api URL - if the API service ends up as
      # neuronest-api.onrender.com, leave as is; otherwise edit and redeploy.
      - key: VITE_API_URL
        value: https://neuronest-api.onrender.com
      # Same major as the local dev machine (Node 22) so the build is identical.
      - key: NODE_VERSION
        value: "22"
      # Set this (and GOOGLE_CLIENT_ID on the API) to light up "Continue with
      # Google". Add https://neuronest-web.onrender.com as an Authorized
      # JavaScript origin in Google Cloud Console - see docs/GOOGLE_LOGIN_SETUP.md
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    # React Router owns the URLs (/patient, /caregiver/..., ...). Without an SPA
    # rewrite, hard-refreshing or sharing a deep link returns Render's 404 page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
